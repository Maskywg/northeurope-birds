<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');

  :root {
    --bg: #f7f5f0;
    --card: #ffffff;
    --border: #e2ddd6;
    --text: #1a1814;
    --muted: #6b6560;
    --hint: #a09890;

  html, body { height: 100%; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  header {

    padding: 0.9rem 1rem;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1rem, 3vw, 1.3rem);
    font-weight: 600;
    flex: 1 1 auto;
    min-width: 200px;
  }
  header h1 span {
    display: block;
    font-size: 0.68rem;
    letter-spacing: 0.12em;
    opacity: 0.65;
    font-family: 'Noto Sans TC', sans-serif;
    font-weight: 400;
    margin-bottom: 2px;
  }
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 0.78rem;
    color: #fff;
    text-decoration: none;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 18px;
    padding: 6px 13px;
    white-space: nowrap;
  }
  .back-link:hover { background: rgba(255,255,255,0.28); }

  .daychips {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 0.5rem 0.7rem;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    flex: 0 0 auto;
  }
  .daychips::-webkit-scrollbar { display: none; }
  .daychips button {
    flex: 0 0 auto;
    font: inherit;
    font-size: 0.74rem;
    color: var(--blue);
    background: var(--blue-light);
    border: none;
    border-radius: 16px;
    padding: 5px 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .daychips button.active {
    background: var(--blue);
    color: #fff;
  }
  .daychips button.all {
    background: var(--green);
    color: #fff;
    font-weight: 500;
  }

  #map {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
  }

  .leaflet-popup-content { margin: 10px 12px; font-family: 'Noto Sans TC', sans-serif; }
  .popup-place { font-size: 0.72rem; color: var(--hint); margin-bottom: 3px; }
  .popup-name { font-size: 0.95rem; font-weight: 600; margin-bottom: 2px; }
  .popup-en { font-size: 0.72rem; color: var(--hint); font-style: italic; margin-bottom: 5px; }
  .popup-note { font-size: 0.8rem; color: var(--muted); margin-bottom: 7px; line-height: 1.5; }
  .popup-link {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 0.78rem;
    color: #fff;
    background: var(--blue);
    text-decoration: none;
    padding: 5px 11px;
    border-radius: 14px;
  }
  .popup-more + .popup-more { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); }

  footer {
    flex: 0 0 auto;
    text-align: center;
    font-size: 0.72rem;
    color: var(--hint);
    padding: 0.6rem 1rem;
    background: var(--card);
    border-top: 1px solid var(--border);
  }
  footer a { color: var(--blue); text-decoration: none; }

  .todo-note {
    font-size: 0.7rem;
    color: var(--amber);
  }
</style>
</head>
<body>

<script>
// 沿途野鳥／野生動物觀察紀錄，依行程 Day 分組
const dayData = [

      { label: "紅嘴鷗（繁殖羽）", en: "Black-headed Gull, breeding plumage", note: "深巧克力色頭罩的繁殖羽", u: "https://www.facebook.com/share/p/1DYu8eEAkr/" },

      { label: "湖畔步道紀錄", en: "", note: "同一湖區的地點紀錄", u: "https://www.facebook.com/share/p/19JDr8tX2L/" },

      { label: "歐亞海鷗", en: "Common Gull (Larus canus)", note: "博物館外海邊", u: "https://www.facebook.com/share/p/1J8ZU6tkRU/" },
    ]},
  ]},
  { n: 4, date: "7/22", route: "赫爾辛基→羅凡聶米", spots: [
    { name: "頌歌中央圖書館 Oodi", lat: 60.1737, lon: 24.9378, items: [

      { label: "白頰黑雁", en: "Barnacle Goose", note: "公園草地上悠閒踱步", u: "https://www.facebook.com/share/p/1HBfLDeUkQ/" },
    ]},
    { name: "舊市場大廳 Vanha kauppahalli", lat: 60.1663, lon: 24.9563, items: [
      { label: "黑背鷗（幼鳥）", en: "Great Black-backed Gull, juvenile", note: "市場旁的年輕海鷗", u: "https://www.facebook.com/share/p/1Bg1AzKpcd/" },
    ]},
  ]},
  { n: 5, date: "7/23", route: "羅凡聶米→伊瓦洛", spots: [
    { name: "Hotelli Ivalo", lat: 68.6570, lon: 27.5417, items: [
      { label: "歐洲野兔", en: "European Hare", note: "飯店周邊草地現身，耳朵含身高近 80 公分", u: "https://www.facebook.com/share/p/187S4T6gY1/" },
      { label: "歐洲野兔（2）", en: "European Hare", note: "同一批野兔的第二段紀錄", u: "https://www.facebook.com/share/p/185ifg4M6m/" },
    ]},
  ]},
  { n: 6, date: "7/24", route: "伊瓦洛→北角", spots: [
    { name: "Sápmi Park, Karasjok（馴鹿農場）", lat: 69.5058, lon: 25.4687, items: [
      { label: "馴鹿", en: "Reindeer", note: "薩米族馴鹿農場近距離接觸", u: "https://www.facebook.com/share/p/1F8TF74xFP/" },
    ]},
    { name: "Scandic Nordkapp", lat: 70.9821, lon: 25.9704, items: [
      { label: "歐亞海鷗（亞成鳥）", en: "Common Gull, immature", note: "北角旅館周邊", u: "https://www.facebook.com/share/p/18z8QSga1P/" },
      { label: "黃鶺鴒", en: "Yellow Wagtail", note: "同一晚在旅館附近拍到", u: "https://www.facebook.com/share/p/17WxekU7FL/" },
    ]},
  ]},
  { n: 7, date: "7/25", route: "北角→阿爾塔→奧斯陸", spots: [
    { name: "阿爾塔 Alta", lat: 69.9689, lon: 23.2716, items: [
      { label: "野放馴鹿", en: "Wild / Free-ranging Reindeer", note: "史前岩畫博物館周邊路邊自由活動的馴鹿群", u: "https://www.facebook.com/share/p/1HTDsAcAUk/" },
    ]},
  ]},
  { n: 8, date: "7/26", route: "奧斯陸→里耳哈默→蓋朗格峽灣", spots: [
    { name: "維吉蘭雕塑公園 Vigeland Park", lat: 59.9264, lon: 10.6981, items: [
      { label: "挪威家麻雀", en: "House Sparrow", note: "雕塑公園裡最不怕人的常駐居民", u: "https://www.facebook.com/share/p/1BjcdzyxJA/" },
      { label: "綠頭鴨（雌）", en: "Mallard, female", note: "公園水池邊悠游的雌鴨", u: "https://www.facebook.com/share/p/1LLnpsAiNi/" },
    ]},
    { name: "Fossevandring 步道", lat: 62.0996, lon: 7.2028, items: [
      { label: "黃鵐", en: "Yellowhammer", note: "瀑布健行步道旁的鳴唱聲把牠引來鏡頭前", u: "https://www.facebook.com/share/p/1CH8C2aSz1/" },
    ]},
    { name: "Hotel Geiranger", lat: 62.1006, lon: 7.2062, items: [
      { label: "歐亞海鷗", en: "Common Gull", note: "飯店窗外峽灣景色裡的常客", u: "https://www.facebook.com/share/p/1chLDT42PD/" },
      { label: "冠小嘴烏鴉", en: "Hooded Crow", note: "飯店周邊景觀照裡順手拍到", u: "https://www.facebook.com/share/p/1M7hsCbpfD/" },
    ]},
    { name: "Geiranger Kyrkje", lat: 62.1013, lon: 7.2074, items: [
      { label: "黃鵐", en: "Yellowhammer", note: "蓋朗格白色小教堂旁再次現身", u: "https://www.facebook.com/share/p/18iiBo5F85/" },
      { label: "白鶺鴒", en: "White Wagtail", note: "教堂旁草地，走路速度奇快", u: "https://www.facebook.com/share/p/1DLEXzmG3v/" },
    ]},
    { name: "Geiranger Camping", lat: 62.0985, lon: 7.1998, items: [
      { label: "蠣鴴", en: "Eurasian Oystercatcher", note: "露營區附近，橘紅色長喙很好辨認", u: "https://www.facebook.com/share/p/1BakuraFif/" },
    ]},
    { name: "蓋朗格一帶（地點未標註）", lat: 62.1000, lon: 7.2040, items: [
      { label: "烏鶇（雌幼鳥）", en: "Eurasian Blackbird, female/juvenile", note: "貼文未標註確切地點，依前後紀錄推測同為蓋朗格一帶", u: "https://www.facebook.com/share/p/1DuN5oLurz/" },
    ]},
  ]},
  { n: 9, date: "7/27", route: "蓋朗格峽灣→布里斯達冰河→索娜峽灣", spots: [
    { name: "Lærdal Hotel", lat: 61.1000, lon: 7.4833, items: [
      { label: "白鶺鴒", en: "White Wagtail", note: "索娜峽灣區旅館前的常見小鳥", u: "https://www.facebook.com/share/p/1DYWwsaxUZ/" },
    ]},
  ]},
  { n: 12, date: "7/30", route: "希茨海爾斯→歐登西", spots: [
    { name: "Scandic Odense／歐登西市區", lat: 55.3932, lon: 10.3876, items: [
      { label: "烏鶇（雌鳥）", en: "Eurasian Blackbird, female", note: "有人留言問是不是在 long stay", u: "https://www.facebook.com/share/p/1Cgg5vt2RU/" },
      { label: "烏鶇", en: "Eurasian Blackbird", note: "童話小鎮街頭再遇烏鶇", u: "https://www.facebook.com/share/p/19AnvjuQ5Z/" },
    ]},
  ]},
  { n: 13, date: "7/31", route: "歐登西→哥本哈根", spots: [
    { name: "Sydhavnen, København", lat: 55.6558, lon: 12.5456, items: [
      { label: "寒鴉", en: "Western Jackdaw", note: "南港運河邊，市區裡意外常見的野鳥", u: "https://www.facebook.com/share/p/18ktpfvQ8S/" },
      { label: "喜鵲", en: "Eurasian Magpie", note: "黑白對比分明的羽色", u: "https://www.facebook.com/share/p/19CgSfd6dz/" },
      { label: "烏鶇（雌鳥）", en: "Eurasian Blackbird, female", note: "行程尾聲，港區再度捕捉到烏鶇身影", u: "https://www.facebook.com/share/p/1BiYWu44L2/" },
    ]},
  ]},
];

const map = L.map('map', { scrollWheelZoom: true });
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);
map.invalidateSize();

const dayLayers = {};
const allMarkers = [];

dayData.forEach(day => {
  const group = L.layerGroup();
  day.spots.forEach(spot => {
    const icon = L.divIcon({
      className: '',
      html: `<div style="background:#2d6a4f;color:#fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:14px;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45)">🐦</div>`,
      iconSize: [28, 28], iconAnchor: [14, 14]
    });
    const popupHtml = spot.items.map(it => `
      <div class="popup-more">
        <div class="popup-name">${it.label}</div>
        ${it.en ? `<div class="popup-en">${it.en}</div>` : ''}
        ${it.note ? `<div class="popup-note">${it.note}</div>` : ''}
        <a class="popup-link" href="${it.u}">查看 FB 貼文 ↗</a>
      </div>
    `).join('');
    const marker = L.marker([spot.lat, spot.lon], { icon }).bindPopup(
      `<div class="popup-place">Day ${day.n}・${day.date}・${spot.name}</div>${popupHtml}`
    );
    marker.addTo(group);
    allMarkers.push(marker);
  });
  dayLayers[day.n] = group;
  group.addTo(map);
});

map.fitBounds(L.featureGroup(allMarkers).getBounds(), { padding: [30, 30] });

// 移動路線箭頭：依 Day → 地點 造訪順序連接
const orderedPlaces = [];
dayData.forEach(day => {
  day.spots.forEach(spot => {
    orderedPlaces.push({ lat: spot.lat, lon: spot.lon });
  });
});

let routeLine = null, routeDecorator = null;
function updateRoute(points) {
  if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
  if (routeDecorator) { map.removeLayer(routeDecorator); routeDecorator = null; }
  if (!points || points.length < 2) return;
  const latlngs = points.map(p => [p.lat, p.lon]);
  routeLine = L.polyline(latlngs, {
    color: '#1a4a7a', weight: 3, opacity: 0.55, dashArray: '1 8', lineCap: 'round'
  }).addTo(map);
  routeDecorator = L.polylineDecorator(routeLine, {
    patterns: [
      { offset: '6%', repeat: '10%', symbol: L.Symbol.arrowHead({
        pixelSize: 10, polygon: false,
        pathOptions: { stroke: true, weight: 2.5, color: '#1a4a7a', opacity: 0.85 }
      }) }
    ]
  }).addTo(map);
}
updateRoute(orderedPlaces);

// Day 篩選按鈕
const chipsEl = document.getElementById('daychips');
let activeDay = 'all';

function setActive(n) {
  activeDay = n;
  Object.keys(dayLayers).forEach(k => {
    if (n === 'all' || String(k) === String(n)) {
      map.addLayer(dayLayers[k]);
    } else {
      map.removeLayer(dayLayers[k]);
    }
  });
  document.querySelectorAll('.daychips button').forEach(b => {
    b.classList.toggle('active', b.dataset.day === String(n));
  });
  if (n === 'all') {
    map.fitBounds(L.featureGroup(allMarkers).getBounds(), { padding: [30, 30] });
    updateRoute(orderedPlaces);
  } else {
    const day = dayData.find(d => d.n === n);
    const dayMarkers = allMarkers.filter(m => day.spots.some(s => s.lat === m.getLatLng().lat && s.lon === m.getLatLng().lng));
    if (dayMarkers.length === 1) {
      map.setView(dayMarkers[0].getLatLng(), 13);
    } else {
      map.fitBounds(L.featureGroup(dayMarkers).getBounds(), { padding: [40, 40] });
    }
    updateRoute(day.spots.map(s => ({ lat: s.lat, lon: s.lon })));
  }
}

let chipsHtml = `<button class="all active" data-day="all" onclick="setActive('all')">全部</button>`;
dayData.forEach(d => {
  chipsHtml += `<button data-day="${d.n}" onclick="setActive(${d.n})">Day ${d.n}</button>`;
});
chipsEl.innerHTML = chipsHtml;

// 部分瀏覽器在 flex 版面完成排版前就初始化地圖，容器尺寸會量到 0，
// 導致 fitBounds 算出異常的縮放層級；延遲一個 tick 後重新校正。
function resyncMap() {
  map.invalidateSize();
  if (activeDay === 'all') {
    map.fitBounds(L.featureGroup(allMarkers).getBounds(), { padding: [30, 30] });
  } else {
    setActive(activeDay);
  }
}
setTimeout(resyncMap, 100);
setTimeout(resyncMap, 500);
window.addEventListener('load', resyncMap);
</script>

</body>
</html>
